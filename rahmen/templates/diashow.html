{% extends 'base.html' %}
{% block inhalt %}
<div id="slideshow">
    <div id="leer-hinweis" class="leer-hinweis" hidden>{{ t('keine_fotos') }}</div>
    <img id="bild-a" class="bild-ebene" alt="">
    <img id="bild-b" class="bild-ebene" alt="">
    <video id="video-a" class="bild-ebene" muted autoplay playsinline hidden></video>
</div>
<a href="{{ url_for('einstellungen') }}" id="einstellungen-ecke" aria-label="{{ t('zu_einstellungen') }}"></a>

<script>
    window.RAHMEN_EINSTELLUNGEN = {
        anzeigeDauerSek: {{ einst.anzeige_dauer_sek | default(8) }},
        uebergangTyp: {{ einst.uebergang_typ | default('fade') | tojson }},
        uebergangDauerMs: {{ einst.uebergang_dauer_ms | default(800) }}
    };
</script>
<script src="{{ url_for('static', filename='js/slideshow.js') }}"></script>
{% endblock %}
